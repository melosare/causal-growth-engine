[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-growth-engine"
version = "0.1.0"
description = "A Bayesian causal growth engine for understanding organic growth and optimizing business investment."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }

dependencies = [
    "arviz>=0.18,<1.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.22,<7.0",
    "pydantic>=2.7,<3.0",
    "pymc>=5.15,<6.0",
    "scipy>=1.13,<2.0",
    "streamlit>=1.35,<2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pandas-stubs>=2.2,<3.0",
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
